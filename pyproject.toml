[project]
name = "stac-smart-search"
version = "0.1.0"
description = "Federated STAC catalog discovery service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "aiohttp>=3.9",
    "asyncpg>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "alembic>=1.13",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "pgvector>=0.2.5",
    # RemoteCLIP embedding stack. In Docker, install the CPU-only torch wheel
    # (see Dockerfile) to avoid pulling the multi-GB CUDA build.
    "torch>=2.2",
    "open-clip-torch>=2.24",
    "huggingface-hub>=0.23",
    # torch 2.2.x wheels are compiled against NumPy 1.x; NumPy 2 breaks them.
    "numpy<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
