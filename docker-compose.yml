services:
  postgres:
    # pgvector image ships the `vector` extension pre-installed.
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stac
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stac"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/stac
      CMR_STAC_ROOT: https://cmr.earthdata.nasa.gov/stac/
      DISCOVERY_TIMEOUT_SECONDS: "30"
      LOG_LEVEL: DEBUG
      MAX_CMR_COLLECTIONS: "500"
    ports:
      - "8000:8000"

volumes:
  pgdata:
